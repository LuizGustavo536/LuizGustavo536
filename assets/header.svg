<svg width="100%" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (NewFire Palette) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060e"/>
      <stop offset="50%" stop-color="#090a18"/>
      <stop offset="100%" stop-color="#06060e"/>
    </linearGradient>

    <!-- Waves Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06060e" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#0077ff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06060e" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06060e" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#0077ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06060e" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 52px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .brand-bracket {
      fill: #00d4ff;
    }
    .brand-subtitle {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 18px;
      font-weight: 600;
      fill: #00d4ff;
      letter-spacing: 1px;
    }
    .brand-tech {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      fill: #9aa0b8;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="240" fill="url(#bgGrad)"/>

  <!-- Fluid Waves Layers -->
  <path d="M0,130 C200,90 400,180 600,140 C800,100 1000,170 1200,120 L1200,240 L0,240 Z" fill="url(#waveGrad1)" />
  <path d="M0,150 C250,190 500,120 750,160 C950,190 1100,140 1200,150 L1200,240 L0,240 Z" fill="url(#waveGrad2)" />

  <!-- Top Accent Neon Line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#waveGrad1)" />

  <!-- Main Title -->
  <g filter="url(#neonGlow)">
    <text x="600" y="90" text-anchor="middle" class="brand-title">
      <tspan class="brand-bracket">&lt;</tspan>Luiz Gustavo<tspan class="brand-bracket"> /&gt;</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="132" text-anchor="middle" class="brand-subtitle">
    DESENVOLVEDOR BACKEND &amp; FULL STACK
  </text>

  <!-- Tech Badges Line -->
  <text x="600" y="165" text-anchor="middle" class="brand-tech">
    Node.js  •  Python  •  VPS Linux  •  Nginx Reverse Proxy  •  PM2  •  Docker
  </text>
</svg>
